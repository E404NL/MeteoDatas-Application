services:
    spring-app:
        container_name: spring-app
        env_file:
            - ./local/spring/.env.properties
        build:
            context: .
            dockerfile: local/spring/Dockerfile
        ports:
            - "8090:8080"
        volumes:
            - ./MeteoDatas-SpringApp:/MeteoDatas-SpringApp
            - maven-cache:/root/.m2
        depends_on:
            - mongodb
            - postgres
        networks:
            - meteo
        tty: true
        restart: unless-stopped

    mongodb:
        image: mongo:8
        container_name: mongodb-local
        environment:
            MONGO_INITDB_ROOT_USERNAME : ${MONGODB_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD : ${MONGODB_PASSWORD}
            MONGO_INITDB_DATABASE : ${MONGODB_DATABASE}
        ports:
            - "27017:27017"
        volumes:
            - ./data/mongo:/data/db
        networks:
            - meteo
        restart: unless-stopped

    postgres:
        image: postgres:15
        container_name: postgres-local
        environment:
            POSTGRES_USER: ${POSTGRES_USERNAME}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DATABASE}
        ports:
            - "5432:5432"
        volumes:
            - ./data/pg/hr:/var/lib/postgresql/data
        networks:
          - meteo

networks:
    meteo:
      driver: bridge

volumes:
    maven-cache:
